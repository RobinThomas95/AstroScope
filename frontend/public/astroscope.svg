<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AstroScope">
  <title>AstroScope</title>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- dark disc so the mark reads the same on light and dark backgrounds -->
  <circle cx="32" cy="32" r="31" fill="#0b1220"/>
  <!-- scope reticle -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="2.5" x2="32" y2="9"/>
    <line x1="2.5" y1="32" x2="9" y2="32"/>
    <line x1="55" y1="32" x2="61.5" y2="32"/>
  </g>
  <!-- barred spiral galaxy -->
  <g fill="none" stroke="#e0f2fe" stroke-width="2.4" stroke-linecap="round">
    <path d="M36 25 c 7 1, 11 7, 8 12 c -2 3, -6 5, -10 4.5"/>
    <path d="M28 31 c -7 -1, -11 -7, -8 -12 c 2 -3, 6 -5, 10 -4.5"/>
  </g>
  <line x1="27" y1="31.5" x2="37" y2="24.5" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="28" r="6.5" fill="url(#core)"/>
  <!-- emission-line spectrum -->
  <path d="M15 51 h7 l1.5 -2.5 l1.5 2.5 h5 l2 -9 l2 9 h5 l1.5 -2.5 l1.5 2.5 h7" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
